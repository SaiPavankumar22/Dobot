[project]
name = "dobot-backend"
version = "0.1.0"
description = "Dobot — always-on personal AI operating layer (gateway, orchestrator, decision engine)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "langgraph>=0.2",
    "langsmith>=0.1",
    # Nebius Sandboxes (ConTree): remote VM execution for SANDBOX_PROVIDER=nebius.
    "contree-sdk>=0.3",
]

[project.optional-dependencies]
mongo = ["motor>=3.5"]
vectors = ["pymilvus>=2.4"]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.3"]
voice = ["faster-whisper>=1.0"]
# CUDA runtime for the voice extra: ctranslate2 loads cublas64_12/cudnn64_9 by bare name, and these
# wheels are the only way to get them without a full CUDA toolkit. Windows-only because that is
# where the DLL search path has to be nudged (app/agents/transcriber.py does it); Linux finds them
# from the wheel layout itself. With them, a 4 GB card transcribes faster than realtime instead of
# leaning on the CPU at ~7x realtime.
voice-gpu = [
    "faster-whisper>=1.0",
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12; sys_platform == 'win32'",
]
deepresearch = ["deepagents>=0.7", "langchain-openai>=0.2"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# UP042: str+Enum (rather than StrEnum) is intentional — these enums are serialised explicitly via
# `.value` in the API contract and the mixin keeps pydantic and JSON round-trips unambiguous.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]
