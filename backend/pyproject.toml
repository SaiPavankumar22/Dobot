[project]
name = "dobot-backend"
version = "0.1.0"
description = "Dobot — always-on personal AI operating layer (gateway, orchestrator, decision engine)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "langgraph>=0.2",
    "langsmith>=0.1",
]

[project.optional-dependencies]
mongo = ["motor>=3.5"]
vectors = ["pymilvus>=2.4"]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.3"]
voice = ["faster-whisper>=1.0"]
deepresearch = ["deepagents>=0.7", "langchain-openai>=0.2"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# UP042: str+Enum (rather than StrEnum) is intentional — these enums are serialised explicitly via
# `.value` in the API contract and the mixin keeps pydantic and JSON round-trips unambiguous.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]
