[package]
name = "dobot-desktop"
version = "0.1.0"
description = "Dobot — always-on personal AI operating layer (desktop shell)"
authors = ["Dobot authors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "dobot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.23"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
