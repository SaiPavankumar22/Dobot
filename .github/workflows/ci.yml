name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (lock-verified)
        # pytest/ruff live in the `dev` extra, not the base dependency set.
        run: uv sync --locked --extra dev
      - name: Run the test suite
        run: uv run --locked --extra dev pytest -q

  desktop:
    name: desktop (tsc + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build

  skills:
    name: shipped skills scan clean
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --extra dev
      # A blocked skill is invisible to the planner: shipping one silently disables a workflow.
      - run: uv run --locked --extra dev pytest tests/test_skill_scanner.py -q
